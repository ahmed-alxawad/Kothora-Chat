# Serves the web app and proxies /api to the backend. TLS (Let's Encrypt) terminates in
# front of this container; see docs/deployment.md.

# Per-IP limits (business document, Section 6.3). Sign-in and sign-up are tight to slow
# password guessing and free-account farming; plan quotas limit chat per user in the API.
limit_req_zone $binary_remote_addr zone=kothora_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kothora_api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/auth/ {
        limit_req zone=kothora_auth burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=kothora_api burst=40 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Answers stream as Server-Sent Events.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
